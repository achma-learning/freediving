<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freediving Tables • 100% Private & Offline</title>
  <meta name="description" content="CO2, O2 and custom breath-hold tables for freediving. No tracking, fully offline.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="icon" href="data:,">

  <style>
    :root {
      --bg: #f8f9fa;
      --text: #212529;
      --accent: #1b9aaa;
      --card: white;
      --border: #ddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1b2a;
        --text: #e0e1dd;
        --card: #1b263b;
        --border: #33415c;
      }
    }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    main { flex:1; max-width:900px; margin:0 auto; padding:20px; width:100%; box-sizing:border-box; }
    h1 { color:var(--accent); text-align:center; margin:0 0 8px 0; }
    .card { background:var(--card); padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.15); margin-bottom:20px; }
    input, select, button {
      padding:12px; margin:6px 0; border-radius:8px; border:1px solid var(--border); font-size:1em; width:100%; box-sizing:border-box;
    }
    button {
      background:var(--accent); color:white; border:none; cursor:pointer; font-weight:bold; font-size:1.1em;
    }
    button:hover { opacity:0.9; }
    button:active { transform:scale(0.98); }
    table { width:100%; border-collapse:collapse; margin-top:15px; }
    th, td { padding:12px; text-align:center; border-bottom:1px solid var(--border); }
    th { background:rgba(27,154,170,0.2); }
    tr.active { background:#e63946 !important; color:white; font-weight:bold; animation:pulse 1s infinite; }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:0.8} 100%{opacity:1} }
    .table-container { overflow-x:auto; }
    footer { text-align:center; padding:20px; color:#888; font-size:0.9em; }
    @media (max-width:600px) {
      table { min-width:450px; }
      .card { padding:15px; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Freediving Training Tables</h1>
    <p style="text-align:center; margin-top:0;">100% offline • No tracking • Voice countdown • Dark mode</p>

    <div class="card">
      <label>Personal best breath-hold (seconds)</label>
      <input type="number" id="maxHold" value="180" min="30" step="5">

      <label>Table type</label>
      <select id="tableType">
        <option value="co2">CO₂ Table (fixed hold, decreasing recovery)</option>
        <option value="o2" selected>O₂ Table (increasing hold, fixed recovery)</option>
        <option value="custom">Custom (progressive with 2 min recovery)</option>
      </select>

      <label>Number of repetitions</label>
      <select id="reps">
        <option>6</option>
        <option selected>8</option>
        <option>10</option>
        <option>12</option>
      </select>

      <button onclick="startTraining()">Generate & Start Training</button>
      <button onclick="resetAll()" style="background:#778da9; margin-top:10px;">Clear All Saved Data</button>
    </div>

    <div id="tableContainer" class="card table-container" style="display:none;"></div>

    <div class="card">
      <h3>Session History (stored only on your device)</h3>
      <div id="history"><i>No sessions yet</i></div>
    </div>
  </main>

  <footer>
    100% private • No data ever leaves your phone • 
    <a href="https://github.com/YOUR-USERNAME/freediving" target="_blank" style="color:var(--accent)">Forked & improved by @YOUR-USERNAME</a>
  </footer>

  <script>
    // 100% working & tested version – Nov 2025
    let countdownInterval;
    let currentRow = -1;
    let tableData = [];

    function generateTable() {
      const maxHold = parseInt(document.getElementById('maxHold').value) || 180;
      const type = document.getElementById('tableType').value;
      const reps = parseInt(document.getElementById('reps').value);

      if (maxHold < 30) throw "Enter at least 30 seconds";

      const rows = [];

      if (type === 'o2') {
        for (let i = 1; i <= reps; i++) {
          rows.push({ hold: Math.round(maxHold * i / reps), recovery: 120 });
        }
      } else if (type === 'co2') {
        const hold = Math.round(maxHold * 0.8);
        let recovery = Math.round(maxHold * 1.5);
        const step = Math.round((recovery - 15) / (reps - 1));
        for (let i = 0; i < reps; i++) {
          rows.push({ hold, recovery: Math.max(15, recovery - step * i) });
        }
      } else { // custom
        for (let i = 1; i <= reps; i++) {
          rows.push({ hold: Math.round(maxHold * i / reps), recovery: 120 });
        }
      }
      return rows;
    }

    function renderTable(table) {
      tableData = table;
      const c = document.getElementById('tableContainer');
      let html = `<h2 style="text-align:center;margin-bottom:20px">${document.getElementById('tableType').selectedOptions[0].text}</h2>`;
      html += '<table><thead><tr><th>#</th><th>Hold</th><th>Recovery</th><th>Status</th></tr></thead><tbody>';
      table.forEach((r, i) => {
        html += `<tr id="row-${i}"><td>${i+1}</td><td>${r.hold}s</td><td>${r.recovery}s</td><td id="status-${i}">Ready</td></tr>`;
      });
      html += '</tbody></table>';
      c.innerHTML = html;
      c.style.display = 'block';
      c.scrollIntoView({behavior:'smooth'});
    }

    function startTraining() {
      clearInterval(countdownInterval);
      document.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
      try {
        const table = generateTable();
        renderTable(table);
        currentRow = 0;
        runPhase();
        saveSession(); // save immediately so history is always up to date
      } catch (e) { alert(e); }
    }

    function runPhase() {
      if (currentRow >= tableData.length) {
        document.getElementById('tableContainer').insertAdjacentHTML('beforeend',
          '<h3 style="text-align:center;color:#1b9aaa;margin-top:30px;">Table completed – Amazing work!</h3>');
        return;
      }

      const row = tableData[currentRow];
      const tr = document.getElementById(`row-${currentRow}`);
      tr.classList.add('active');

      if (currentRow === 0) {
        speak("Get ready");
        setTimeout(() => startHold(row), 1500);
      } else {
        speak(`Recover ${row.recovery} seconds`);
        countdown(row.recovery, () => startHold(row));
      }
    }

    function startHold(row) {
      speak(`Hold for ${row.hold} seconds`);
      countdown(row.hold, () => {
        document.getElementById(`row-${currentRow}`).classList.remove('active');
        currentRow++;
        setTimeout(runPhase, 2000);
      });
    }

    function countdown(seconds, onFinish) {
      let time = seconds;
      const cell = document.getElementById(`status-${currentRow}`);
      cell.textContent = time + " s";

      countdownInterval = setInterval(() => {
        time--;
        if (time > 0) {
          cell.textContent = time + " s";
          if (time <= 5) speak(time);
        } else {
          cell.textContent = "Breathe!";
          clearInterval(countdownInterval);
          onFinish();
        }
      }, 1000);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }
    }

    function saveSession() {
      const sessions = JSON.parse(localStorage.getItem('freediveSessions') || '[]');
      sessions.push({
        date: new Date().toLocaleString(),
        type: document.getElementById('tableType').selectedOptions[0].text,
        pb: document.getElementById('maxHold').value + " s"
      });
      localStorage.setItem('freediveSessions', JSON.stringify(sessions));
      loadHistory();
    }

    function loadHistory() {
      const div = document.getElementById('history');
      const sessions = JSON.parse(localStorage.getItem('freediveSessions') || '[]');
      if (sessions.length === 0) return div.innerHTML = "<i>No sessions yet</i>";

      let html = "<ul style='margin:0;padding-left:20px'>";
      sessions.slice(-20).reverse().forEach(s => {
        html += `<li>${s.date} – ${s.type} (PB ${s.pb})</li>`;
      });
      html += "</ul>";
      div.innerHTML = html;
    }

    function resetAll() {
      if (confirm("Delete all saved sessions?")) {
        localStorage.removeItem('freediveSessions');
        loadHistory();
        alert("All data cleared");
      }
    }

    // Init
    loadHistory();
  </script>
</body>
</html>
